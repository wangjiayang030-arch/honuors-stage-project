<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Logger</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <a href="#log">Log Workout</a>
        <a href="#history">Workout History</a>
        <a href="#analytics">Progress Analytics</a>
    </nav>

    <main class="container">
        <section id="log-section" class="section">
            <h2>Add New Workout</h2>
            <form id="workout-form">
                <div class="form-group">
                    <label>Exercise Name</label>
                    <input type="text" id="exercise-name" placeholder="e.g. Bench Press" required>
                </div>
                <div class="form-group">
                    <label>Sets</label>
                    <input type="number" id="sets" min="1" required>
                </div>
                <div class="form-group">
                    <label>Reps per set</label>
                    <input type="number" id="reps" min="1" required>
                </div>
                <div class="form-group">
                    <label>Weight (kg)</label>
                    <input type="number" id="weight" min="0" step="0.5" required>
                </div>
                <div class="form-group">
                    <label>Workout Date (yyyy-mm-dd)</label>
                    <input type="date" id="workout-date" required>
                </div>
                <button type="submit">Save Workout</button>
            </form>
        </section>

        <section id="history-section" class="section">
            <h2>Workout History</h2>
            <div id="history-list">
                <p>No workout records yet.</p>
            </div>
        </section>

        <section id="analytics-section" class="section">
            <h2>Progress Analytics</h2>
            <div id="chart-area">
                <p>Analytics charts will display here once workout data is added.</p>
            </div>
        </section>
    </main>
</body>
</html>
