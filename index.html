<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Logger</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav class="navbar">
        <a href="#log" data-target="log-section">Log Workout</a>
        <a href="#history" data-target="history-section">Workout History</a>
        <a href="#analytics" data-target="analytics-section">Progress Analytics</a>
    </nav>

    <main class="container">
        <section id="log-section" class="section">
            <h2>Add New Workout</h2>
            <form id="workout-form">
                <div class="form-group">
                    <label>Exercise Name</label>
                    <input type="text" id="exercise-name" placeholder="e.g. Bench Press" required>
                </div>
                <div class="form-group">
                    <label>Sets</label>
                    <input type="number" id="sets" min="1" required>
                </div>
                <div class="form-group">
                    <label>Reps per set</label>
                    <input type="number" id="reps" min="1" required>
                </div>
                <div class="form-group">
                    <label>Weight (kg)</label>
                    <input type="number" id="weight" min="0" step="0.5" placeholder="0 if bodyweight">
                </div>
                <div class="form-group">
                    <label>Workout Date (yyyy-mm-dd)</label>
                    <input type="date" id="workout-date" required>
                </div>
                <button type="submit" class="submit-btn">Save Workout</button>
            </form>
        </section>

        <section id="history-section" class="section">
            <h2>Workout History</h2>
            <div class="toolbar">
                <button id="exportBtn">Export Backup (JSON)</button>
                <input type="file" id="importFileInput" accept=".json" style="display:none;">
                <button id="importBtn">Import Backup (JSON)</button>
            </div>
            <div id="workout-list"></div>
        </section>

        <section id="analytics-section" class="section">
            <h2>Progress Analytics</h2>
            <div id="stats-summary"></div>
            <div id="chart-container">
                <canvas id="weightChart"></canvas>
            </div>
        </section>
    </main>

    <!-- Edit Modal -->
    <div id="editModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);z-index:999;">
        <div style="background:#fff;max-width:400px;margin:80px auto;padding:24px;border-radius:8px;">
            <h3>Edit Workout</h3>
            <input type="hidden" id="edit-id">
            <div style="margin:10px 0;">
                <label>Exercise Name</label>
                <input type="text" id="edit-exercise-name" style="width:100%;padding:6px;margin-top:4px;">
            </div>
            <div style="margin:10px 0;">
                <label>Sets</label>
                <input type="number" id="edit-sets" min="1" style="width:100%;padding:6px;margin-top:4px;">
            </div>
            <div style="margin:10px 0;">
                <label>Reps per set</label>
                <input type="number" id="edit-reps" min="1" style="width:100%;padding:6px;margin-top:4px;">
            </div>
            <div style="margin:10px 0;">
                <label>Weight (kg)</label>
                <input type="number" id="edit-weight" min="0" step="0.5" style="width:100%;padding:6px;margin-top:4px;">
            </div>
            <div style="margin:10px 0;">
                <label>Date</label>
                <input type="date" id="edit-date" style="width:100%;padding:6px;margin-top:4px;">
            </div>
            <div style="margin-top:16px;display:flex;gap:10px;justify-content:flex-end;">
                <button id="cancelEdit" style="padding:6px 12px;">Cancel</button>
                <button id="saveEdit" style="padding:6px 12px;background:#28a745;color:white;border:none;border-radius:4px;">Save</button>
            </div>
        </div>
    </div>

    <script src="db.js"></script>
    <script src="app.js"></script>
</body>
</html>
